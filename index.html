mine:{t:'Minesweeper',i:'💣',w:250,h:300,b:()=>'<div class=ms></div>',init:el=>{const g=el.querySelector('.ms'),N=9,M=10;let cells,over,first;
const nb=i=>{const r=i/N|0,c=i%N,o=[];for(let a=-1;a<2;a++)for(let b=-1;b<2;b++){const R=r+a,C=c+b;if((a||b)&&R>=0&&R<N&&C>=0&&C<N)o.push(R*N+C)}return o};
const opn=i=>{const c=cells[i];if(c.o||c.f||over)return;if(first){first=0;let n=0;while(n<M){const j=Math.random()*N*N|0;if(j!=i&&!cells[j].m){cells[j].m=1;n++}}}
c.o=1;if(c.m){over=1;cells.forEach(x=>x.m&&(x.o=1))}else if(!nb(i).some(j=>cells[j].m))nb(i).forEach(j=>opn(j))};
const render=()=>{g.innerHTML='<div style="display:grid;grid-template-columns:repeat(9,24px)">'+cells.map((c,i)=>`<div data-i=${i} style="width:24px;height:24px;display:grid;place-items:center;font-weight:700;background:${c.o?'#ddd':'#c0c0c0'};border:${c.o?'1px solid #999':'2px outset #fff'}">${c.o?(c.m?'💣':nb(i).filter(j=>cells[j].m).length||''):c.f?'🚩':''}</div>`).join('')+'</div><button style="margin-top:4px;width:100%">🙂 New game</button>'};
const reset=()=>{over=0;first=1;cells=[...Array(N*N)].map(()=>({m:0,o:0,f:0}));render()};
g.onclick=e=>{if(e.target.tagName=='BUTTON')return reset();const i=e.target.dataset.i;if(i!=null){opn(+i);render()}};
g.oncontextmenu=e=>{e.preventDefault();const i=e.target.dataset.i;if(i!=null&&!cells[i].o){cells[i].f^=1;render()}};reset()}},
